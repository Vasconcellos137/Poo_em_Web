<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Inserir Tarefa</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <form method="post" action="/create">
            <label>Tarefa</label><input type="text" name="title"/><br>
            <label>Prazo</label><input type="text" name="deadLine"/><br>
            <button type="submit">Salvar</button>
        </form> 

        <br>
        <table>
            <thead>
                <tr>
                    <th>Titulo</th><th>Criada em</th><th>Prazo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each = "todo : ${todos}">
                    <td th:text = "${todo.title}"></td>
                    <td th:text = "${todo.createdAt}"></td>
                    <td th:text = "${todo.deadLine}"></td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
